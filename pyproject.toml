[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nsqa"
version = "0.1.0"
description = "Question-réponse explicable sur graphe de connaissances : LLM + raisonnement symbolique"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
    "pyshacl>=0.26",
    "numpy>=1.26",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
nsqa = "nsqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
